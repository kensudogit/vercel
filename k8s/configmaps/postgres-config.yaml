apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: vercel-database
data:
  POSTGRES_DB: "postgres"
  POSTGRES_USER: "vercel_user"
---
# Secret values are intentionally not stored in Git.
# Create the secret at deployment time, for example:
# kubectl create secret generic postgres-secret \
#   --from-literal=POSTGRES_PASSWORD='<set-securely>'
